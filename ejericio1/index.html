<!DOCTYPE html>
<html>
<body>

    <h2>Conociendo Java Script</h2>
    <button onclick="saludar()">Haz clic aquí</button>

    <h1 id="resultado"></h1>

<script>
    function saludar() {
    let nombre = prompt("¿Cuál es tu nombre?");
    document.getElementById("resultado").innerText = "¡Hola, " + nombre + "! 👋";
    }
</script>
</body>
</html>
